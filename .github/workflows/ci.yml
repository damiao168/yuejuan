name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            lab/package-lock.json
      - run: npm ci
      - run: npm ci --prefix lab
      - run: npm audit --audit-level=high
      - run: npm --prefix lab audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npm --workspace apps/web-admin run check:production-routes
      - run: npm --workspace apps/desktop-client run check:security-config
      - run: npm run check:story049
      - run: npm run check:story050
      - run: npm run check:story051
      - run: npm run check:story052
      - run: npm run check:story053
      - run: npm run check:story057
      - run: npm run check:story061
      - run: npm run check:story063
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser golden paths with API mocks
        run: npm run test:e2e
      - run: npm --prefix lab test
      - run: npm --prefix lab run eval
      - run: npm --prefix lab run gate:dev

  desktop-rust:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --check --manifest-path apps/desktop-client/src-tauri/Cargo.toml
      - run: cargo check --locked --manifest-path apps/desktop-client/src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path apps/desktop-client/src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path apps/desktop-client/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Validate recovery PowerShell syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem infra/docker-compose/scripts -Filter *.ps1
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "$($file.Name): $($errors.Message -join '; ')" }
          }

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: edugrade_e2e
          POSTGRES_USER: edugrade
          POSTGRES_PASSWORD: edugrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edugrade -d edugrade_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: services/api-gateway/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lab/package-lock.json
      - run: npm ci --prefix ../../lab
      - run: go mod verify
      - run: go mod tidy -diff
      - run: test -z "$(gofmt -l .)"
      - run: go test ./... -count=1
      - name: Race-check concurrent security and task primitives
        run: go test -race ./internal/auth ./internal/idempotency ./internal/workerruntime ./internal/files -count=1
      - run: go vet ./...
      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: PostgreSQL workflows
        env:
          EDUGRADE_E2E_DATABASE_URL: postgres://edugrade:edugrade@127.0.0.1:5432/edugrade_e2e?sslmode=disable
        run: go test ./internal/server -run 'PostgresTestDatabase|Story056.*E2E' -count=1 -v
      - name: Lab/main boundary integration
        run: npm --prefix ../.. run check:lab-integration

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ocr-worker/pyproject.toml
            services/image-quality-worker/pyproject.toml
            services/page-processing-worker/pyproject.toml
            services/subjective-grading-worker/pyproject.toml
      - run: python -m pip install --upgrade pip==26.1.2 setuptools==83.0.0
      - run: >-
          python -m pip install pytest==9.1.1 pip-audit==2.10.1 ruff==0.16.0
          -e services/ocr-worker
          -e services/image-quality-worker
          -e services/page-processing-worker
          -e services/subjective-grading-worker
      - run: python -m pip check
      - name: Audit installed third-party Python packages
        run: |
          python -m pip freeze --exclude-editable > "${RUNNER_TEMP}/audit-requirements.txt"
          if grep -qi '^edugrade-' "${RUNNER_TEMP}/audit-requirements.txt"; then
            echo "Editable EduGrade packages leaked into the audit input."
            exit 1
          fi
          python -m pip_audit --strict -r "${RUNNER_TEMP}/audit-requirements.txt"
      - run: ruff check ai-services services/image-quality-worker services/ocr-worker services/page-processing-worker services/subjective-grading-worker
      - name: OCR worker tests
        run: python -m pytest -q services/ocr-worker/tests
      - name: Image quality worker tests
        run: python -m pytest -q services/image-quality-worker/tests
      - name: Page processing worker tests
        run: python -m pytest -q services/page-processing-worker/tests
      - name: Subjective grading worker tests
        run: python -m pytest -q services/subjective-grading-worker/tests
      - run: PYTHONPATH=ai-services python -m unittest discover -s ai-services/tests -p 'test_*.py'
      - run: python -m pytest -q tests/ai-evaluation

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: >-
          docker compose
          --env-file infra/docker-compose/.env.example
          -f infra/docker-compose/docker-compose.yml
          --profile tools
          --profile ocr
          --profile quality
          --profile processing
          --profile subjective-grading
          --profile observability
          config -q
      - name: Build and validate subjective grading worker image
        run: |
          docker compose \
            --env-file infra/docker-compose/.env.example \
            -f infra/docker-compose/docker-compose.yml \
            --profile subjective-grading \
            build subjective-grading-worker
          docker run --rm --entrypoint python \
            -e EDUGRADE_API_BASE_URL=http://api-gateway:8080 \
            -e EDUGRADE_SUBJECTIVE_WORKER_TENANT_CODE=ci \
            -e EDUGRADE_SUBJECTIVE_WORKER_USERNAME=ci-worker \
            -e EDUGRADE_SUBJECTIVE_WORKER_PASSWORD=ci-only-placeholder \
            edugrade/subjective-grading-worker:local \
            -c "from subjective_grading_worker.config import load_settings; load_settings()"
      - name: Validate STORY-056 isolated Compose
        env:
          EDUGRADE_E2E_ADMIN_PASSWORD: ci-story056-admin
          EDUGRADE_E2E_WORKER_PASSWORD: ci-story056-worker
          EDUGRADE_E2E_UNPRIVILEGED_PASSWORD: ci-story056-unprivileged
        run: docker compose -f infra/docker-compose/docker-compose.story056-e2e.yml --profile e2e config -q
      - name: Validate STORY-060 isolated Compose
        env:
          EDUGRADE_E2E_ADMIN_PASSWORD: ci-story060-admin
          EDUGRADE_E2E_GRADING_TOKEN: ci-story060-grading-token-at-least-32-characters
          EDUGRADE_E2E_MODEL_API_KEY: ci-story060-model-key
        run: docker compose -f infra/docker-compose/docker-compose.story060-e2e.yml --profile e2e config -q

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: API Gateway SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: services/api-gateway
          format: cyclonedx-json
          output-file: sbom-api-gateway.cdx.json
          upload-artifact: false
      - name: Web Admin SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: apps/web-admin
          format: cyclonedx-json
          output-file: sbom-web-admin.cdx.json
          upload-artifact: false
      - name: Desktop Client SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: apps/desktop-client
          format: cyclonedx-json
          output-file: sbom-desktop-client.cdx.json
          upload-artifact: false
      - name: Python Workers SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: services
          format: cyclonedx-json
          output-file: sbom-python-workers.cdx.json
          upload-artifact: false
      - name: AI Service SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ai-services
          format: cyclonedx-json
          output-file: sbom-ai-service.cdx.json
          upload-artifact: false
      - name: High and critical vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edugrade-sboms
          path: sbom-*.cdx.json
          if-no-files-found: error
