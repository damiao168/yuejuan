name: CI
on:
  pull_request:
  push: {branches: [main]}
permissions: {contents: read}
concurrency: {group: ci-${{ github.ref }}, cancel-in-progress: true}
jobs:
  web-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run ci:contracts
      - run: npm run lint
      - run: npm run typecheck
  web-unit:
    strategy: {fail-fast: false, matrix: {workspace: [web-admin, student-portal, desktop-client]}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm --workspace apps/${{ matrix.workspace }} run test
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm --workspace apps/web-admin run check:production-routes
      - run: npm --workspace apps/desktop-client run check:security-config
  story-gates:
    strategy: {fail-fast: false, matrix: {story: ['049','050','051','052','053','057','061','063']}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run check:story${{ matrix.story }}
  web-e2e-mocked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24, cache: npm, cache-dependency-path: lab/package-lock.json}
      - run: npm ci --prefix lab
      - run: npm --prefix lab test
      - run: npm --prefix lab run eval
      - run: npm --prefix lab run gate:dev
  go-static:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/api-gateway}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '1.26.6'}
      - run: go mod verify
      - run: go mod tidy -diff
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
  go-unit:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/api-gateway}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '1.26.6'}
      - run: go test ./... -count=1
  go-race:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/api-gateway}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '1.26.6'}
      - run: go test -race ./internal/auth ./internal/idempotency ./internal/workerruntime ./internal/files -count=1
  go-security:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/api-gateway}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '1.26.6'}
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
  go-postgres:
    runs-on: ubuntu-latest
    services:
      postgres: {image: postgres:16-alpine, env: {POSTGRES_DB: edugrade_e2e, POSTGRES_USER: edugrade, POSTGRES_PASSWORD: edugrade}, ports: ['5432:5432']}
    defaults: {run: {working-directory: services/api-gateway}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '1.26.6'}
      - run: go test ./internal/server -run 'PostgresTestDatabase|Story056.*E2E' -count=1 -v
        env: {EDUGRADE_E2E_DATABASE_URL: postgres://edugrade:edugrade@127.0.0.1:5432/edugrade_e2e?sslmode=disable}
  go-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24, cache: npm}
      - run: npm ci --prefix lab
      - run: npm run check:lab-integration
  python-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install ruff==0.16.0 pip-audit==2.10.1 -r ai-services/requirements.txt
      - run: python -m pip check
      - run: ruff check ai-services services lab/evals/math-recognition
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: ocr, path: services/ocr-worker/tests}
          - {name: image-quality, path: services/image-quality-worker/tests}
          - {name: page-processing, path: services/page-processing-worker/tests}
          - {name: subjective-grading, path: services/subjective-grading-worker/tests}
          - {name: math-verification, path: services/math-verification-worker/tests}
          - {name: math-bench, path: lab/evals/math-recognition/test_math_bench.py}
          - {name: ai-services, path: ai-services/tests}
          - {name: ai-evaluation, path: tests/ai-evaluation}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install pytest==9.1.1 -r ai-services/requirements.txt
      - run: python -m pytest -q ${{ matrix.path }}
  desktop-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with: {toolchain: 1.97.1, components: rustfmt, clippy}
      - run: cargo fmt --check --manifest-path apps/desktop-client/src-tauri/Cargo.toml
      - run: cargo check --locked --manifest-path apps/desktop-client/src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path apps/desktop-client/src-tauri/Cargo.toml
  compose-config:
    runs-on: ubuntu-latest
    steps: [{uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262}, {run: docker compose --env-file infra/docker-compose/.env.example -f infra/docker-compose/docker-compose.yml config -q}]
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with: {version: v0.70.0, scan-type: fs, scan-ref: ., severity: HIGH,CRITICAL, ignore-unfixed: true, exit-code: '1'}
  real-system-e2e:
    runs-on: ubuntu-latest
    steps: [{uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262}, {run: docker compose -f infra/docker-compose/docker-compose.story060-e2e.yml config -q}]
  ci-gate:
    if: always()
    needs: [web-static, web-unit, web-build, story-gates, web-e2e-mocked, lab, go-static, go-unit, go-race, go-security, go-postgres, go-boundary, python-static, python-tests, desktop-rust, compose-config, supply-chain, real-system-e2e]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -Eq 'failure|cancelled|skipped'; then exit 1; fi
