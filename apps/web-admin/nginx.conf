server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /health {
    access_log off;
    return 200 "web-admin ok\n";
    add_header Content-Type text/plain;
  }

  # PDF.js loads its worker as an ES module. Nginx's default MIME table does
  # not include .mjs in every distribution, and browsers reject octet-stream.
  location ~* \.mjs$ {
    types { application/javascript mjs; }
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
