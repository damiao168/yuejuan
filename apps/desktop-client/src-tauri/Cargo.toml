[package]
name = "edugrade-desktop-client"
version = "0.1.0"
description = "EduGrade Enterprise Windows desktop client"
authors = ["EduGrade Enterprise"]
license = "UNLICENSED"
repository = ""
edition = "2021"

[lib]
name = "edugrade_desktop_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
