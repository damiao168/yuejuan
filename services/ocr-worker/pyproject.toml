[project]
name = "edugrade-ocr-worker"
version = "0.1.0"
description = "EduGrade real OCR worker"
requires-python = ">=3.11,<3.13"
dependencies = []

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
paddle = [
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.1",
]

[tool.setuptools.packages.find]
include = ["ocr_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
