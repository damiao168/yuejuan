[project]
name = "edugrade-image-quality-worker"
version = "0.1.0"
description = "EduGrade answer-sheet image quality worker"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["image_quality*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
