upstream edugrade_api {
  zone edugrade_api 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server api-gateway:8080 resolve;
}

upstream edugrade_web {
  zone edugrade_web 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server web-admin:80 resolve;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 110m;

  location = /health {
    access_log off;
    return 200 "nginx ok\n";
    add_header Content-Type text/plain;
  }

  location /api/ {
    proxy_pass http://edugrade_api;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 780s;
    proxy_read_timeout 780s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ready {
    proxy_pass http://edugrade_api;
  }

  location /backend-health {
    proxy_pass http://edugrade_api/health;
  }

  location / {
    proxy_pass http://edugrade_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
