name: edugrade-enterprise

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${EDUGRADE_CONTAINER_LOG_MAX_SIZE:-10m}
    max-file: ${EDUGRADE_CONTAINER_LOG_MAX_FILES:-5}

services:
  postgres:
    image: postgres:16-alpine
    container_name: edugrade-postgres
    environment:
      POSTGRES_DB: ${EDUGRADE_POSTGRES_DB}
      POSTGRES_USER: ${EDUGRADE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${EDUGRADE_POSTGRES_PASSWORD}
    # Data-plane ports bind to loopback by default; production deployments
    # should only expose nginx. Override EDUGRADE_INTERNAL_BIND_HOST for
    # isolated development hosts that genuinely need LAN access.
    ports:
      - "${EDUGRADE_INTERNAL_BIND_HOST:-127.0.0.1}:${EDUGRADE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: ${EDUGRADE_POSTGRES_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: edugrade-redis
    command: >
      sh -c 'if [ -z "$${EDUGRADE_REDIS_PASSWORD}" ];
      then echo "EDUGRADE_REDIS_PASSWORD is required; refusing to start an unauthenticated Redis" >&2; exit 1;
      fi;
      exec redis-server --appendonly yes --requirepass "$${EDUGRADE_REDIS_PASSWORD}"'
    environment:
      EDUGRADE_REDIS_PASSWORD: ${EDUGRADE_REDIS_PASSWORD}
    ports:
      - "${EDUGRADE_INTERNAL_BIND_HOST:-127.0.0.1}:${EDUGRADE_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    mem_limit: ${EDUGRADE_REDIS_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${EDUGRADE_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: edugrade-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${EDUGRADE_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${EDUGRADE_MINIO_SECRET_KEY}
    ports:
      - "${EDUGRADE_INTERNAL_BIND_HOST:-127.0.0.1}:${EDUGRADE_MINIO_API_PORT:-9000}:9000"
      - "${EDUGRADE_INTERNAL_BIND_HOST:-127.0.0.1}:${EDUGRADE_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    mem_limit: ${EDUGRADE_MINIO_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 18
    logging: *default-logging
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: edugrade-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${EDUGRADE_QDRANT_API_KEY:?EDUGRADE_QDRANT_API_KEY is required; see infra/docker-compose/README.md upgrade notes}
    ports:
      - "${EDUGRADE_INTERNAL_BIND_HOST:-127.0.0.1}:${EDUGRADE_QDRANT_HTTP_PORT:-6333}:6333"
      - "${EDUGRADE_INTERNAL_BIND_HOST:-127.0.0.1}:${EDUGRADE_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: ${EDUGRADE_QDRANT_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "grep -qi ':18BD' /proc/net/tcp"]
      interval: 10s
      timeout: 5s
      retries: 18
    logging: *default-logging
    restart: unless-stopped

  db-migrate:
    image: postgres:16-alpine
    container_name: edugrade-db-migrate
    profiles: ["tools"]
    environment:
      EDUGRADE_POSTGRES_DSN: ${EDUGRADE_POSTGRES_DSN}
      EDUGRADE_MIGRATION_BASELINE_VERSION: ${EDUGRADE_MIGRATION_BASELINE_VERSION:-}
    volumes:
      - ../../services/api-gateway/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        lock_log="$$(mktemp)"
        lock_app="edugrade-migrate-$${HOSTNAME}"
        PGAPPNAME="$${lock_app}" psql "$${EDUGRADE_POSTGRES_DSN}" -Atc "SELECT pg_advisory_lock(19770428061); SELECT pg_sleep(86400)" >"$${lock_log}" 2>&1 &
        lock_pid="$$!"
        cleanup_lock() { kill "$${lock_pid}" 2>/dev/null || true; wait "$${lock_pid}" 2>/dev/null || true; rm -f "$${lock_log}"; }
        trap cleanup_lock EXIT INT TERM
        acquired=false
        for attempt in $$(seq 1 120); do
          if ! kill -0 "$${lock_pid}" 2>/dev/null; then cat "$${lock_log}" >&2; exit 44; fi
          lock_granted="$$(PGAPPNAME=edugrade-migrate-probe psql "$${EDUGRADE_POSTGRES_DSN}" -Atc "SELECT EXISTS (SELECT 1 FROM pg_locks l JOIN pg_stat_activity a ON a.pid = l.pid WHERE l.locktype = 'advisory' AND l.granted AND a.application_name = '$${lock_app}')")"
          if [ "$${lock_granted}" = "t" ]; then acquired=true; break; fi
          sleep 1
        done
        if [ "$${acquired}" != "true" ]; then echo "timed out acquiring migration advisory lock" >&2; exit 44; fi
        psql "$${EDUGRADE_POSTGRES_DSN}" -v ON_ERROR_STOP=1 -c "
          CREATE TABLE IF NOT EXISTS schema_migration (
            filename TEXT PRIMARY KEY,
            checksum TEXT NOT NULL,
            applied_at TIMESTAMPTZ NOT NULL DEFAULT now()
          )"
        tracked_count="$$(psql "$${EDUGRADE_POSTGRES_DSN}" -Atc "SELECT count(*) FROM schema_migration")"
        legacy_schema="$$(psql "$${EDUGRADE_POSTGRES_DSN}" -Atc "SELECT CASE WHEN to_regclass('public.tenant') IS NULL THEN 0 ELSE 1 END")"
        if [ "$${tracked_count}" = "0" ] && [ "$${legacy_schema}" = "1" ]; then
          if [ -z "$${EDUGRADE_MIGRATION_BASELINE_VERSION}" ]; then
            echo "existing schema has no migration history; set an explicit EDUGRADE_MIGRATION_BASELINE_VERSION after verifying the schema" >&2
            exit 42
          fi
          if [ "$${EDUGRADE_MIGRATION_BASELINE_VERSION}" != "000020" ]; then
            echo "unsupported baseline version; this release has a verified fingerprint only for 000020" >&2
            exit 42
          fi
          psql "$${EDUGRADE_POSTGRES_DSN}" -v ON_ERROR_STOP=1 -f /migrations/baseline/000020_fingerprint.sql
          found_baseline=false
          for file in /migrations/*.sql; do
            filename="$$(basename "$${file}")"
            checksum="$$(sha256sum "$${file}" | awk '{print $$1}')"
            psql "$${EDUGRADE_POSTGRES_DSN}" -v ON_ERROR_STOP=1 -c "INSERT INTO schema_migration (filename, checksum) VALUES ('$${filename}', '$${checksum}') ON CONFLICT (filename) DO NOTHING"
            echo "baselined $${filename}"
            case "$${filename}" in "$${EDUGRADE_MIGRATION_BASELINE_VERSION}"_*) found_baseline=true; break;; esac
          done
          if [ "$${found_baseline}" != "true" ]; then echo "baseline migration file not found" >&2; exit 42; fi
        fi
        for file in /migrations/*.sql; do
          filename="$$(basename "$${file}")"
          checksum="$$(sha256sum "$${file}" | awk '{print $$1}')"
          stored="$$(psql "$${EDUGRADE_POSTGRES_DSN}" -Atc "SELECT checksum FROM schema_migration WHERE filename = '$${filename}'")"
          if [ -n "$${stored}" ]; then
            if [ "$${stored}" != "$${checksum}" ]; then
              echo "checksum mismatch for applied migration $${filename}" >&2
              exit 43
            fi
            echo "skipping $${filename}"
            continue
          fi
          echo "applying $${filename}"
          { cat "$${file}"; printf "\nINSERT INTO schema_migration (filename, checksum) VALUES ('%s', '%s');\n" "$${filename}" "$${checksum}"; } |
            psql "$${EDUGRADE_POSTGRES_DSN}" -v ON_ERROR_STOP=1 -1
        done

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: edugrade-minio-init
    profiles: ["tools"]
    environment:
      EDUGRADE_MINIO_ACCESS_KEY: ${EDUGRADE_MINIO_ACCESS_KEY}
      EDUGRADE_MINIO_SECRET_KEY: ${EDUGRADE_MINIO_SECRET_KEY}
      EDUGRADE_FILE_BUCKET: ${EDUGRADE_FILE_BUCKET}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set edugrade http://minio:9000 "$${EDUGRADE_MINIO_ACCESS_KEY}" "$${EDUGRADE_MINIO_SECRET_KEY}"
        mc mb --ignore-existing "edugrade/$${EDUGRADE_FILE_BUCKET}"
        mc anonymous set none "edugrade/$${EDUGRADE_FILE_BUCKET}"
        mc ls "edugrade/$${EDUGRADE_FILE_BUCKET}"

  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
      args:
        GO_BUILD_IMAGE: ${EDUGRADE_GO_BUILD_IMAGE:-golang:1.26.6-alpine}
        API_RUNTIME_IMAGE: ${EDUGRADE_API_RUNTIME_IMAGE:-alpine:3.22}
        APP_VERSION: ${EDUGRADE_APP_VERSION:-dev}
        GIT_SHA: ${EDUGRADE_GIT_SHA:-unknown}
        BUILD_TIME: ${EDUGRADE_BUILD_TIME:-unknown}
        IMAGE_DIGEST: ${EDUGRADE_IMAGE_DIGEST:-unknown}
        RELEASE_ID: ${EDUGRADE_RELEASE_ID:-local}
        SCHEMA_VERSION: ${EDUGRADE_SCHEMA_VERSION:-000104}
        GOPROXY: ${EDUGRADE_GO_PROXY:-}
    image: edugrade/api-gateway:${EDUGRADE_IMAGE_TAG:-local}
    container_name: edugrade-api-gateway
    environment:
      EDUGRADE_ENV: ${EDUGRADE_ENV}
      EDUGRADE_SERVICE_NAME: api-gateway
      EDUGRADE_HTTP_HOST: 0.0.0.0
      EDUGRADE_HTTP_PORT: 8080
      EDUGRADE_LOG_LEVEL: ${EDUGRADE_LOG_LEVEL}
      EDUGRADE_READINESS_TIMEOUT: ${EDUGRADE_READINESS_TIMEOUT}
      EDUGRADE_SHUTDOWN_TIMEOUT: ${EDUGRADE_SHUTDOWN_TIMEOUT}
      EDUGRADE_SESSION_TTL: ${EDUGRADE_SESSION_TTL}
      EDUGRADE_REMEMBERED_SESSION_TTL: ${EDUGRADE_REMEMBERED_SESSION_TTL:-720h}
      EDUGRADE_LOGIN_FAILURE_LIMIT: ${EDUGRADE_LOGIN_FAILURE_LIMIT}
      EDUGRADE_LOGIN_FAILURE_WINDOW: ${EDUGRADE_LOGIN_FAILURE_WINDOW}
      EDUGRADE_SESSION_COOKIE_NAME: ${EDUGRADE_SESSION_COOKIE_NAME}
      EDUGRADE_SESSION_COOKIE_SECURE: ${EDUGRADE_SESSION_COOKIE_SECURE}
      EDUGRADE_HTTP_MAX_HEADER_BYTES: ${EDUGRADE_HTTP_MAX_HEADER_BYTES}
      EDUGRADE_MAX_REQUEST_BODY_BYTES: ${EDUGRADE_MAX_REQUEST_BODY_BYTES}
      EDUGRADE_HTTP_READ_HEADER_TIMEOUT: ${EDUGRADE_HTTP_READ_HEADER_TIMEOUT:-5s}
      EDUGRADE_HTTP_READ_TIMEOUT: ${EDUGRADE_HTTP_READ_TIMEOUT:-15s}
      EDUGRADE_HTTP_WRITE_TIMEOUT: ${EDUGRADE_HTTP_WRITE_TIMEOUT:-780s}
      EDUGRADE_HTTP_IDLE_TIMEOUT: ${EDUGRADE_HTTP_IDLE_TIMEOUT:-60s}
      EDUGRADE_CORS_ALLOWED_ORIGINS: ${EDUGRADE_CORS_ALLOWED_ORIGINS}
      EDUGRADE_CORS_ALLOWED_METHODS: ${EDUGRADE_CORS_ALLOWED_METHODS}
      EDUGRADE_CORS_ALLOWED_HEADERS: ${EDUGRADE_CORS_ALLOWED_HEADERS}
      EDUGRADE_POSTGRES_DSN: ${EDUGRADE_POSTGRES_DSN}
      EDUGRADE_POSTGRES_DSN_FILE: ${EDUGRADE_POSTGRES_DSN_FILE:-}
      EDUGRADE_POSTGRES_MAX_OPEN_CONNS: ${EDUGRADE_POSTGRES_MAX_OPEN_CONNS:-10}
      EDUGRADE_POSTGRES_MAX_IDLE_CONNS: ${EDUGRADE_POSTGRES_MAX_IDLE_CONNS:-5}
      EDUGRADE_POSTGRES_CONN_MAX_LIFETIME: ${EDUGRADE_POSTGRES_CONN_MAX_LIFETIME:-30m}
      EDUGRADE_POSTGRES_CONN_MAX_IDLE_TIME: ${EDUGRADE_POSTGRES_CONN_MAX_IDLE_TIME:-5m}
      EDUGRADE_POSTGRES_STATEMENT_TIMEOUT: ${EDUGRADE_POSTGRES_STATEMENT_TIMEOUT:-60s}
      EDUGRADE_POSTGRES_LOCK_TIMEOUT: ${EDUGRADE_POSTGRES_LOCK_TIMEOUT:-5s}
      EDUGRADE_REDIS_ADDR: redis:6379
      EDUGRADE_REDIS_PASSWORD: ${EDUGRADE_REDIS_PASSWORD}
      EDUGRADE_REDIS_PASSWORD_FILE: ${EDUGRADE_REDIS_PASSWORD_FILE:-}
      EDUGRADE_REDIS_DB: ${EDUGRADE_REDIS_DB}
      EDUGRADE_MINIO_ENDPOINT: minio:9000
      EDUGRADE_MINIO_ACCESS_KEY: ${EDUGRADE_MINIO_ACCESS_KEY}
      EDUGRADE_MINIO_SECRET_KEY: ${EDUGRADE_MINIO_SECRET_KEY}
      EDUGRADE_MINIO_ACCESS_KEY_FILE: ${EDUGRADE_MINIO_ACCESS_KEY_FILE:-}
      EDUGRADE_MINIO_SECRET_KEY_FILE: ${EDUGRADE_MINIO_SECRET_KEY_FILE:-}
      EDUGRADE_MINIO_USE_SSL: "false"
      EDUGRADE_FILE_BUCKET: ${EDUGRADE_FILE_BUCKET}
      EDUGRADE_FILE_MAX_UPLOAD_BYTES: ${EDUGRADE_FILE_MAX_UPLOAD_BYTES}
      EDUGRADE_FILE_ALLOWED_EXTENSIONS: ${EDUGRADE_FILE_ALLOWED_EXTENSIONS}
      EDUGRADE_FILE_RECONCILIATION_INTERVAL: ${EDUGRADE_FILE_RECONCILIATION_INTERVAL:-24h}
      EDUGRADE_FILE_RECONCILIATION_STALE_AFTER: ${EDUGRADE_FILE_RECONCILIATION_STALE_AFTER:-1h}
      EDUGRADE_FILE_RECONCILIATION_BATCH_SIZE: ${EDUGRADE_FILE_RECONCILIATION_BATCH_SIZE:-200}
      EDUGRADE_FILE_RECONCILIATION_OBJECT_LIMIT: ${EDUGRADE_FILE_RECONCILIATION_OBJECT_LIMIT:-1000}
      EDUGRADE_BARCODE_ACTIVE_KEY_ID: ${EDUGRADE_BARCODE_ACTIVE_KEY_ID}
      EDUGRADE_BARCODE_HMAC_KEYS: ${EDUGRADE_BARCODE_HMAC_KEYS}
      EDUGRADE_BARCODE_HMAC_KEYS_FILE: ${EDUGRADE_BARCODE_HMAC_KEYS_FILE:-}
      EDUGRADE_QDRANT_URL: ${EDUGRADE_QDRANT_URL}
      EDUGRADE_QDRANT_API_KEY: ${EDUGRADE_QDRANT_API_KEY}
      EDUGRADE_QDRANT_API_KEY_FILE: ${EDUGRADE_QDRANT_API_KEY_FILE:-}
      EDUGRADE_AI_GRADING_ENABLED: ${EDUGRADE_AI_GRADING_ENABLED:-false}
      EDUGRADE_ALLOW_MOCK_AI: ${EDUGRADE_ALLOW_MOCK_AI:-false}
      EDUGRADE_AI_SERVICE_URL: ${EDUGRADE_AI_SERVICE_URL}
      EDUGRADE_AI_SERVICE_TOKEN: ${EDUGRADE_AI_SERVICE_TOKEN}
      EDUGRADE_AI_SERVICE_TOKEN_FILE: ${EDUGRADE_AI_SERVICE_TOKEN_FILE:-}
      EDUGRADE_AI_SERVICE_TIMEOUT: ${EDUGRADE_AI_SERVICE_TIMEOUT:-750s}
      EDUGRADE_AI_SERVICE_MAX_RETRIES: ${EDUGRADE_AI_SERVICE_MAX_RETRIES:-0}
      EDUGRADE_AI_MODEL_VERSION: ${EDUGRADE_AI_MODEL_VERSION}
      EDUGRADE_AI_PROMPT_VERSION: ${EDUGRADE_AI_PROMPT_VERSION}
      EDUGRADE_AI_MIN_CONFIDENCE: ${EDUGRADE_AI_MIN_CONFIDENCE:-0.8}
      EDUGRADE_AI_PROVIDER_KEY: ${EDUGRADE_AI_PROVIDER_KEY:-local}
      EDUGRADE_AI_DEPLOYMENT_KEY: ${EDUGRADE_AI_DEPLOYMENT_KEY:-local-qwen3-4b-q4-k-m}
      EDUGRADE_AI_ADAPTER_TYPE: ${EDUGRADE_AI_ADAPTER_TYPE:-local_llama_cpp}
      EDUGRADE_AI_DEPLOYMENT_REGION: ${EDUGRADE_AI_DEPLOYMENT_REGION:-on_premise}
      EDUGRADE_AI_CAPABILITY_PROFILE: ${EDUGRADE_AI_CAPABILITY_PROFILE:-local-pilot-v1}
      EDUGRADE_SLOW_REQUEST_THRESHOLD: ${EDUGRADE_SLOW_REQUEST_THRESHOLD}
      EDUGRADE_WORKER_HEARTBEAT_STALE_AFTER: ${EDUGRADE_WORKER_HEARTBEAT_STALE_AFTER:-30s}
      EDUGRADE_BOOTSTRAP_TENANT_CODE: ${EDUGRADE_BOOTSTRAP_TENANT_CODE:-platform}
      EDUGRADE_BOOTSTRAP_ROLE_CODE: ${EDUGRADE_BOOTSTRAP_ROLE_CODE:-platform_admin}
      EDUGRADE_BOOTSTRAP_USERNAME: ${EDUGRADE_BOOTSTRAP_USERNAME:-platform_admin}
      EDUGRADE_BOOTSTRAP_DISPLAY_NAME: ${EDUGRADE_BOOTSTRAP_DISPLAY_NAME:-Platform Admin}
      EDUGRADE_BOOTSTRAP_PASSWORD: ${EDUGRADE_BOOTSTRAP_PASSWORD:-}
    ports:
      - "${EDUGRADE_INTERNAL_BIND_HOST:-127.0.0.1}:${EDUGRADE_API_PORT:-8080}:8080"
    mem_limit: ${EDUGRADE_API_MEM_LIMIT:-1g}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health/ready | grep -q '\"status\":\"ready\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
    logging: *default-logging
    restart: unless-stopped

  web-admin:
    build:
      context: ../..
      dockerfile: apps/web-admin/Dockerfile
      args:
        VITE_API_BASE_URL: ${EDUGRADE_WEB_API_BASE_URL:-}
        VITE_RELEASE_ID: ${EDUGRADE_RELEASE_ID:-local}
        NODE_BUILD_IMAGE: ${EDUGRADE_NODE_BUILD_IMAGE:-node:24-alpine}
        WEB_RUNTIME_IMAGE: ${EDUGRADE_WEB_RUNTIME_IMAGE:-nginx:1.29-alpine}
    image: edugrade/web-admin:${EDUGRADE_IMAGE_TAG:-local}
    container_name: edugrade-web-admin
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health | grep -q web-admin"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging
    restart: unless-stopped

  grading-agent:
    build:
      context: ../..
      dockerfile: ai-services/Dockerfile
      args:
        AI_PYTHON_IMAGE: ${EDUGRADE_AI_PYTHON_IMAGE:-python:3.12.13-alpine3.24}
    image: edugrade/grading-agent:${EDUGRADE_IMAGE_TAG:-local}
    container_name: edugrade-grading-agent
    environment:
      EDUGRADE_GRADING_AGENT_HOST: 0.0.0.0
      EDUGRADE_GRADING_AGENT_PORT: 8100
      EDUGRADE_GRADING_AGENT_TOKEN: ${EDUGRADE_AI_SERVICE_TOKEN}
      EDUGRADE_GRADING_MODEL_BASE_URL: ${EDUGRADE_GRADING_MODEL_BASE_URL}
      EDUGRADE_GRADING_MODEL_API_KEY: ${EDUGRADE_GRADING_MODEL_API_KEY}
      EDUGRADE_GRADING_MODEL_NAME: ${EDUGRADE_GRADING_MODEL_NAME:-qwen3-4b-q4-k-m}
      EDUGRADE_GRADING_MODEL_VERSION: ${EDUGRADE_AI_MODEL_VERSION}
      EDUGRADE_GRADING_PROVIDER_KEY: ${EDUGRADE_AI_PROVIDER_KEY:-local}
      EDUGRADE_GRADING_DEPLOYMENT_KEY: ${EDUGRADE_AI_DEPLOYMENT_KEY:-local-qwen3-4b-q4-k-m}
      EDUGRADE_GRADING_ADAPTER_TYPE: ${EDUGRADE_AI_ADAPTER_TYPE:-local_llama_cpp}
      EDUGRADE_GRADING_DEPLOYMENT_REGION: ${EDUGRADE_AI_DEPLOYMENT_REGION:-on_premise}
      EDUGRADE_GRADING_CAPABILITY_PROFILE: ${EDUGRADE_AI_CAPABILITY_PROFILE:-local-pilot-v1}
      EDUGRADE_GRADING_PROMPT_VERSION: ${EDUGRADE_AI_PROMPT_VERSION}
      EDUGRADE_GRADING_MODEL_TIMEOUT_SECONDS: ${EDUGRADE_GRADING_MODEL_TIMEOUT_SECONDS:-360}
      EDUGRADE_GRADING_MODEL_MAX_OUTPUT_TOKENS: ${EDUGRADE_GRADING_MODEL_MAX_OUTPUT_TOKENS:-512}
      EDUGRADE_GRADING_MODEL_READY_TIMEOUT_SECONDS: ${EDUGRADE_GRADING_MODEL_READY_TIMEOUT_SECONDS:-3}
      EDUGRADE_GRADING_MODEL_QUEUE_TIMEOUT_SECONDS: ${EDUGRADE_GRADING_MODEL_QUEUE_TIMEOUT_SECONDS:-5}
      EDUGRADE_GRADING_MODEL_MAX_RETRIES: ${EDUGRADE_GRADING_MODEL_MAX_RETRIES:-1}
    mem_limit: ${EDUGRADE_GRADING_AGENT_MEM_LIMIT:-2g}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8100/health | grep -q healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging
    restart: unless-stopped

  ocr-worker:
    build:
      context: ../..
      dockerfile: services/ocr-worker/Dockerfile
      args:
        INSTALL_PADDLEOCR: ${EDUGRADE_OCR_INSTALL_PADDLEOCR:-true}
        OCR_PYTHON_IMAGE: ${EDUGRADE_OCR_PYTHON_IMAGE:-python:3.11.15-slim-trixie}
        PIP_INDEX_URL: ${EDUGRADE_PYPI_INDEX_URL:-https://pypi.org/simple}
        DEBIAN_MIRROR: ${EDUGRADE_DEBIAN_MIRROR:-http://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${EDUGRADE_DEBIAN_SECURITY_MIRROR:-http://deb.debian.org/debian-security}
    image: edugrade/ocr-worker:${EDUGRADE_IMAGE_TAG:-local}
    container_name: edugrade-ocr-worker
    profiles: ["ocr"]
    environment:
      EDUGRADE_API_BASE_URL: http://api-gateway:8080
      EDUGRADE_OCR_WORKER_TENANT_CODE: ${EDUGRADE_OCR_WORKER_TENANT_CODE}
      EDUGRADE_OCR_WORKER_USERNAME: ${EDUGRADE_OCR_WORKER_USERNAME}
      EDUGRADE_OCR_WORKER_PASSWORD: ${EDUGRADE_OCR_WORKER_PASSWORD}
      EDUGRADE_OCR_ENGINE: ${EDUGRADE_OCR_ENGINE}
      EDUGRADE_OCR_ENGINE_VERSION: ${EDUGRADE_OCR_ENGINE_VERSION}
      EDUGRADE_OCR_MODEL_VERSION: ${EDUGRADE_OCR_MODEL_VERSION}
      EDUGRADE_OCR_MIN_CONFIDENCE: ${EDUGRADE_OCR_MIN_CONFIDENCE}
      EDUGRADE_OCR_POLL_INTERVAL: ${EDUGRADE_OCR_POLL_INTERVAL}
      EDUGRADE_OCR_BATCH_SIZE: ${EDUGRADE_OCR_BATCH_SIZE}
      EDUGRADE_OCR_DEVICE: ${EDUGRADE_OCR_DEVICE}
      EDUGRADE_OCR_PREPROCESS_PROFILE: ${EDUGRADE_OCR_PREPROCESS_PROFILE}
      EDUGRADE_OCR_WORKER_ID: ${EDUGRADE_OCR_WORKER_ID}
      EDUGRADE_OCR_LEASE_SECONDS: ${EDUGRADE_OCR_LEASE_SECONDS:-300}
      EDUGRADE_OCR_HEARTBEAT_INTERVAL: ${EDUGRADE_OCR_HEARTBEAT_INTERVAL:-10}
      EDUGRADE_OCR_HEARTBEAT_TIMEOUT: ${EDUGRADE_OCR_HEARTBEAT_TIMEOUT:-3}
      EDUGRADE_OCR_RUNTIME_ENABLED: "true"
      EDUGRADE_MATH_RUNTIME_ENABLED: "false"
      EDUGRADE_MATH_VERIFY_BASE_URL: http://math-verification-worker:8092
      EDUGRADE_MATH_VERIFY_TOKEN: ${EDUGRADE_AI_SERVICE_TOKEN}
      EDUGRADE_FORMULA_MODEL_VERSION: ${EDUGRADE_FORMULA_MODEL_VERSION:-PP-FormulaNet_plus-M}
    mem_limit: ${EDUGRADE_OCR_WORKER_MEM_LIMIT:-4g}
    volumes:
      - ocr_model_cache:/home/ocr-worker/.paddlex
    depends_on:
      api-gateway:
        condition: service_healthy
      math-verification-worker:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  math-recognition-worker:
    image: edugrade/ocr-worker:${EDUGRADE_IMAGE_TAG:-local}
    container_name: edugrade-math-recognition-worker
    profiles: ["ocr"]
    environment:
      EDUGRADE_API_BASE_URL: http://api-gateway:8080
      EDUGRADE_OCR_WORKER_TENANT_CODE: ${EDUGRADE_OCR_WORKER_TENANT_CODE}
      EDUGRADE_OCR_WORKER_USERNAME: ${EDUGRADE_OCR_WORKER_USERNAME}
      EDUGRADE_OCR_WORKER_PASSWORD: ${EDUGRADE_OCR_WORKER_PASSWORD}
      EDUGRADE_OCR_ENGINE: ${EDUGRADE_OCR_ENGINE}
      EDUGRADE_OCR_ENGINE_VERSION: ${EDUGRADE_OCR_ENGINE_VERSION}
      EDUGRADE_OCR_MODEL_VERSION: ${EDUGRADE_OCR_MODEL_VERSION}
      EDUGRADE_OCR_MIN_CONFIDENCE: ${EDUGRADE_OCR_MIN_CONFIDENCE}
      EDUGRADE_OCR_POLL_INTERVAL: ${EDUGRADE_OCR_POLL_INTERVAL}
      EDUGRADE_OCR_BATCH_SIZE: 1
      EDUGRADE_OCR_DEVICE: ${EDUGRADE_OCR_DEVICE}
      EDUGRADE_OCR_PREPROCESS_PROFILE: ${EDUGRADE_OCR_PREPROCESS_PROFILE}
      EDUGRADE_OCR_WORKER_ID: math-recognition-worker-1
      EDUGRADE_OCR_LEASE_SECONDS: ${EDUGRADE_OCR_LEASE_SECONDS:-300}
      EDUGRADE_OCR_HEARTBEAT_INTERVAL: ${EDUGRADE_OCR_HEARTBEAT_INTERVAL:-10}
      EDUGRADE_OCR_HEARTBEAT_TIMEOUT: ${EDUGRADE_OCR_HEARTBEAT_TIMEOUT:-3}
      EDUGRADE_OCR_RUNTIME_ENABLED: "false"
      EDUGRADE_MATH_RUNTIME_ENABLED: ${EDUGRADE_MATH_RUNTIME_ENABLED:-true}
      EDUGRADE_MATH_VERIFY_BASE_URL: http://math-verification-worker:8092
      EDUGRADE_MATH_VERIFY_TOKEN: ${EDUGRADE_AI_SERVICE_TOKEN}
      EDUGRADE_FORMULA_MODEL_VERSION: ${EDUGRADE_FORMULA_MODEL_VERSION:-PP-FormulaNet_plus-M}
    mem_limit: ${EDUGRADE_MATH_RECOGNITION_WORKER_MEM_LIMIT:-4g}
    cpus: ${EDUGRADE_MATH_RECOGNITION_WORKER_CPU_LIMIT:-4.0}
    volumes:
      - ocr_model_cache:/home/ocr-worker/.paddlex
    depends_on:
      api-gateway:
        condition: service_healthy
      math-verification-worker:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  image-quality-worker:
    build:
      context: ../..
      dockerfile: services/image-quality-worker/Dockerfile
      args:
        QUALITY_PYTHON_IMAGE: ${EDUGRADE_QUALITY_PYTHON_IMAGE:-python:3.11.15-slim-trixie}
    image: edugrade/image-quality-worker:${EDUGRADE_IMAGE_TAG:-local}
    container_name: edugrade-image-quality-worker
    profiles: ["quality"]
    environment:
      EDUGRADE_API_BASE_URL: http://api-gateway:8080
      EDUGRADE_IMAGE_QUALITY_TENANT_CODE: ${EDUGRADE_IMAGE_QUALITY_TENANT_CODE}
      EDUGRADE_IMAGE_QUALITY_USERNAME: ${EDUGRADE_IMAGE_QUALITY_USERNAME}
      EDUGRADE_IMAGE_QUALITY_PASSWORD: ${EDUGRADE_IMAGE_QUALITY_PASSWORD}
      EDUGRADE_IMAGE_QUALITY_BATCH_SIZE: ${EDUGRADE_IMAGE_QUALITY_BATCH_SIZE:-1}
      EDUGRADE_IMAGE_QUALITY_LEASE_SECONDS: ${EDUGRADE_IMAGE_QUALITY_LEASE_SECONDS}
      EDUGRADE_IMAGE_QUALITY_POLL_INTERVAL: ${EDUGRADE_IMAGE_QUALITY_POLL_INTERVAL}
      EDUGRADE_IMAGE_QUALITY_WORKER_ID: ${EDUGRADE_IMAGE_QUALITY_WORKER_ID}
    mem_limit: ${EDUGRADE_IMAGE_QUALITY_MEM_LIMIT:-2g}
    depends_on:
      api-gateway:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  subjective-grading-worker:
    build:
      context: ../..
      dockerfile: services/subjective-grading-worker/Dockerfile
      args:
        SUBJECTIVE_PYTHON_IMAGE: ${EDUGRADE_SUBJECTIVE_PYTHON_IMAGE:-python:3.11.15-slim-trixie}
    image: edugrade/subjective-grading-worker:${EDUGRADE_IMAGE_TAG:-local}
    container_name: edugrade-subjective-grading-worker
    profiles: ["subjective-grading"]
    environment:
      EDUGRADE_API_BASE_URL: http://api-gateway:8080
      EDUGRADE_SUBJECTIVE_WORKER_TENANT_CODE: ${EDUGRADE_SUBJECTIVE_WORKER_TENANT_CODE}
      EDUGRADE_SUBJECTIVE_WORKER_USERNAME: ${EDUGRADE_SUBJECTIVE_WORKER_USERNAME}
      EDUGRADE_SUBJECTIVE_WORKER_PASSWORD: ${EDUGRADE_SUBJECTIVE_WORKER_PASSWORD}
      EDUGRADE_SUBJECTIVE_WORKER_ID: ${EDUGRADE_SUBJECTIVE_WORKER_ID:-compose-subjective-1}
      EDUGRADE_SUBJECTIVE_WORKER_POLL_INTERVAL: ${EDUGRADE_SUBJECTIVE_WORKER_POLL_INTERVAL:-5}
      EDUGRADE_SUBJECTIVE_WORKER_LEASE_SECONDS: ${EDUGRADE_SUBJECTIVE_WORKER_LEASE_SECONDS:-300}
      EDUGRADE_SUBJECTIVE_WORKER_HEARTBEAT_INTERVAL: ${EDUGRADE_SUBJECTIVE_WORKER_HEARTBEAT_INTERVAL:-10}
      EDUGRADE_SUBJECTIVE_WORKER_HEARTBEAT_TIMEOUT: ${EDUGRADE_SUBJECTIVE_WORKER_HEARTBEAT_TIMEOUT:-3}
      EDUGRADE_SUBJECTIVE_WORKER_HEALTH_MAX_AGE: ${EDUGRADE_SUBJECTIVE_WORKER_HEALTH_MAX_AGE:-120}
    mem_limit: ${EDUGRADE_SUBJECTIVE_WORKER_MEM_LIMIT:-1g}
    depends_on:
      api-gateway:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  math-verification-worker:
    build:
      context: ../..
      dockerfile: services/math-verification-worker/Dockerfile
      args:
        MATH_PYTHON_IMAGE: ${EDUGRADE_MATH_PYTHON_IMAGE:-python:3.11.15-slim-trixie}
    image: edugrade/math-verification-worker:${EDUGRADE_IMAGE_TAG:-local}
    container_name: edugrade-math-verification-worker
    profiles: ["math", "ocr"]
    environment:
      EDUGRADE_MATH_VERIFY_TOKEN: ${EDUGRADE_AI_SERVICE_TOKEN}
      EDUGRADE_MATH_VERIFY_PORT: 8092
      EDUGRADE_MATH_VERIFY_TIMEOUT_SECONDS: ${EDUGRADE_MATH_VERIFY_TIMEOUT_SECONDS:-3}
    expose: ["8092"]
    mem_limit: ${EDUGRADE_MATH_VERIFY_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/healthz', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  page-processing-worker:
    build:
      context: ../..
      dockerfile: services/page-processing-worker/Dockerfile
      args:
        PAGE_PROCESSING_PYTHON_IMAGE: ${EDUGRADE_PAGE_PROCESSING_PYTHON_IMAGE:-python:3.11.15-slim-trixie}
    image: edugrade/page-processing-worker:${EDUGRADE_IMAGE_TAG:-local}
    container_name: edugrade-page-processing-worker
    profiles: ["processing"]
    environment:
      EDUGRADE_API_BASE_URL: http://api-gateway:8080
      EDUGRADE_PAGE_PROCESSING_TENANT_CODE: ${EDUGRADE_PAGE_PROCESSING_TENANT_CODE}
      EDUGRADE_PAGE_PROCESSING_USERNAME: ${EDUGRADE_PAGE_PROCESSING_USERNAME}
      EDUGRADE_PAGE_PROCESSING_PASSWORD: ${EDUGRADE_PAGE_PROCESSING_PASSWORD}
      EDUGRADE_PAGE_PROCESSING_BATCH_SIZE: ${EDUGRADE_PAGE_PROCESSING_BATCH_SIZE:-1}
      EDUGRADE_PAGE_PROCESSING_LEASE_SECONDS: ${EDUGRADE_PAGE_PROCESSING_LEASE_SECONDS:-600}
      EDUGRADE_PAGE_PROCESSING_POLL_INTERVAL: ${EDUGRADE_PAGE_PROCESSING_POLL_INTERVAL:-4}
      EDUGRADE_PAGE_PROCESSING_MAX_PAGES: ${EDUGRADE_PAGE_PROCESSING_MAX_PAGES:-500}
      EDUGRADE_PAGE_PROCESSING_MAX_PAGE_PIXELS: ${EDUGRADE_PAGE_PROCESSING_MAX_PAGE_PIXELS:-50000000}
      EDUGRADE_PAGE_PROCESSING_MAX_TOTAL_PIXELS: ${EDUGRADE_PAGE_PROCESSING_MAX_TOTAL_PIXELS:-1000000000}
      EDUGRADE_PAGE_PROCESSING_WORKER_ID: ${EDUGRADE_PAGE_PROCESSING_WORKER_ID:-compose-page-processing-1}
      EDUGRADE_PAGE_PROCESSING_HEARTBEAT_INTERVAL: ${EDUGRADE_PAGE_PROCESSING_HEARTBEAT_INTERVAL:-30}
      EDUGRADE_PAGE_PROCESSING_HEARTBEAT_TIMEOUT: ${EDUGRADE_PAGE_PROCESSING_HEARTBEAT_TIMEOUT:-10}
    mem_limit: ${EDUGRADE_PAGE_PROCESSING_MEM_LIMIT:-8g}
    depends_on:
      api-gateway:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    container_name: edugrade-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${EDUGRADE_NGINX_HTTP_PORT:-8088}:80"
    depends_on:
      web-admin:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health | grep -q nginx"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.2
    container_name: edugrade-prometheus
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${EDUGRADE_INTERNAL_BIND_HOST:-127.0.0.1}:${EDUGRADE_PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9090/-/healthy | grep -q Prometheus"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.2
    container_name: edugrade-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${EDUGRADE_GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${EDUGRADE_GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "${EDUGRADE_INTERNAL_BIND_HOST:-127.0.0.1}:${EDUGRADE_GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 18
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  ocr_model_cache:
  prometheus_data:
  grafana_data:
